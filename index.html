
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">

<title> </title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #080b14;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;

    background:
        radial-gradient(ellipse at 50% 0%, rgba(75,72,160,.15), transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(0,125,165,.10), transparent 55%),
        #080b14;
}

.audio-card {
    width: 100%;
    max-width: 480px;
    padding: 35px 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        145deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025)
    );

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 26px;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow: 0 25px 80px rgba(0,0,0,.4);
}

audio {
    display: block;
    width: 100%;
    height: 48px;
    accent-color: #8174ff;
}

@media(max-width:600px) {
    .audio-card {
        padding: 28px 20px;
        border-radius: 23px;
    }
}
</style>
</head>

<body>

<main class="audio-card">

    <audio controls preload="metadata">
        <source
            src="https://github.com/ostadoomade/Farjad/raw/refs/heads/main/All%20I%20want.m4a"
            type="audio/mpeg"
        >
    </audio>

</main>

</body>
</html>
